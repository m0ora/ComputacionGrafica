<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Formulario de reserva</title>
  <link
    rel="stylesheet"
    href="../css/ejr2.css"
  >
</head>
<body>

  <main class="form-page">
    <section class="form-section">
      <div class="form-container">

        <header class="form-header">
          <span class="eyebrow">
            RESERVAS
          </span>
          <h1>
            Reserve su mesa
          </h1>
          <p>
            Complete el formulario para confirmar su reserva. Los campos marcados con
            <strong>*</strong> son obligatorios.
          </p>
        </header>

        <form
          class="contact-form"
          action="#"
          method="post"
        >

          <div class="form-field">
            <label for="fecha">
              Fecha
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="date"
              id="fecha"
              name="fecha"
              required
            >
          </div>

          <div class="form-field">
            <label for="hora">
              Hora
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="time"
              id="hora"
              name="hora"
              required
            >
          </div>

          <div class="form-field">
            <label for="personas">
              Número de personas
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="number"
              id="personas"
              name="personas"
              min="1"
              max="20"
              step="1"
              placeholder="2"
              required
            >
          </div>

          <div class="form-field">
            <label for="comentarios">
              Comentarios
            </label>
            <textarea
              id="comentarios"
              name="comentarios"
              rows="6"
              maxlength="500"
              placeholder="Alguna solicitud especial..."
              aria-describedby="comentarios-help"
            ></textarea>
            <small
              id="comentarios-help"
              class="field-help"
            >
              Máximo 500 caracteres.
            </small>
          </div>

          <div class="form-actions">
            <button
              type="submit"
              class="button button-primary"
            >
              Confirmar reserva
            </button>
            <button
              type="reset"
              class="button button-secondary"
            >
              Limpiar
            </button>
          </div>

        </form>
      </div>
    </section>
  </main>

</body>
</html>
